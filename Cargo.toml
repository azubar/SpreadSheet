[workspace]
resolver = "2"
members = [
    "native_api_1c/native_api_1c",
    "native_api_1c/native_api_1c_core",
    "native_api_1c/native_api_1c_macro",
    "spreadsheet",
]

[patch.crates-io]
native_api_1c = { path = "native_api_1c/native_api_1c" }
native_api_1c_core = { path = "native_api_1c/native_api_1c_core" }
native_api_1c_macro = { path = "native_api_1c/native_api_1c_macro" }

[profile.release]
lto = true
strip = true
# одна единица кодогенерации — лучше оптимизация и меньше размер DLL/SO
codegen-units = 1
