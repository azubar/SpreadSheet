[package]
name = "spreadsheet"
version = "0.6.5"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
native_api_1c = { path = "../native_api_1c/native_api_1c" }
utf16_lit = "2.0" # используется кодом, который генерируют макросы native_api_1c
tiny-skia = "0.11"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
arboard = "3.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = ["Data_Pdf", "Storage_Streams", "Foundation", "Win32_System_Com"] }

[target.'cfg(not(windows))'.dependencies]
tempfile = "3.8"
