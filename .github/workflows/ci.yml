name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Форматування
        run: cargo fmt --check -p spreadsheet
      - name: Тести
        run: cargo test -p spreadsheet
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Збірка release
        run: cargo build -p spreadsheet --release
